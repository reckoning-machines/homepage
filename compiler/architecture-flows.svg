<svg xmlns="http://www.w3.org/2000/svg" id="schematic" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">Three ways to establish analytical meaning</title>
  <desc id="description">Conventional RAG reconstructs meaning from retrieved documents. A conventional knowledge graph requires explicit engineering and maintenance. Context Compiler turns research into governed knowledge. The brass arrow from Knowledge back to Research shows how each new question draws on earlier findings.</desc>
  <style>
    @import url("/fonts/fonts.css");
    /* The page supplies its own drafting surface. A direct visit uses the same midnight ground. */
    :root { background: #070e1c; }
    :root:target { background: transparent; }
    .heading { font: 400 12px 'JetBrains Mono', monospace; letter-spacing: .09em; fill: #9ba8ba; }
    .stage { font: 400 17px Inter, Arial, sans-serif; fill: #c2cad5; }
    .compiler .stage { fill: #cec3ab; }
    .link { stroke: #718097; stroke-width: 1; marker-end: url(#forward-tip); }
    .rule { stroke: #8997ac; stroke-opacity: .27; }
    p { margin: 0; color: #9ba8ba; font: 400 14px/1.35 Inter, Arial, sans-serif; }
    .return { fill: none; stroke: #d9c9a3; stroke-width: 1.8; }
    .graph { transform: translateY(94px); }
    .compiler { transform: translateY(188px); }
    .wrapped { display: none; }
    @media (max-width: 550px) {
      .stage { font-size: 14px; }
      .heading { font-size: 11px; }
      .single { display: none; }
      .wrapped { display: inline; }
      .graph { transform: translateY(104px); }
      .graph .note { transform: translateY(14px); }
      .compiler { transform: translateY(222px); }
      .rule { transform: translateY(10px); }
      .graph .rule { transform: translateY(24px); }
    }
  </style>
  <defs>
    <marker id="forward-tip" viewBox="0 0 6 8" refX="5" refY="4" markerWidth="6" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="m1 1 4 3-4 3" fill="none" stroke="#718097"/>
    </marker>
    <marker id="return-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="m2 1 6 4-6 4" fill="none" stroke="#d9c9a3" stroke-width="1.8"/>
    </marker>
    <g id="connections">
      <svg width="37%" height="48"><line class="link" x1="5.6em" x2="94%" y1="37" y2="37"/></svg>
      <svg x="37%" width="37%" height="48"><line class="link" x1="6.1em" x2="94%" y1="37" y2="37"/></svg>
    </g>
  </defs>
  <g class="row">
    <text class="heading" y="12">CONVENTIONAL RAG</text>
    <g class="stage">
      <text y="42">Documents</text><text x="37%" y="42">Retrieval</text><text x="74%" y="42">Reasoning</text>
      <use href="#connections"/>
    </g>
    <foreignObject class="note" y="52" width="100%" height="40"><p xmlns="http://www.w3.org/1999/xhtml">Analytical meaning reconstructed at query time.</p></foreignObject>
    <line class="rule" x2="100%" y1="81" y2="81"/>
  </g>
  <g class="row graph">
    <text class="heading" y="12">CONVENTIONAL KNOWLEDGE GRAPH</text>
    <g class="stage">
      <text y="42">Documents</text><text x="37%" y="42">Engineering</text>
      <text class="single" x="74%" y="42">Knowledge Graph</text>
      <text class="wrapped" x="74%" y="42">Knowledge<tspan x="74%" dy="16">Graph</tspan></text>
      <use href="#connections"/>
    </g>
    <foreignObject class="note" y="52" width="100%" height="40"><p xmlns="http://www.w3.org/1999/xhtml">Analytical knowledge explicitly engineered and maintained.</p></foreignObject>
    <line class="rule" x2="100%" y1="81" y2="81"/>
  </g>
  <g class="row compiler">
    <text class="heading" y="12">CONTEXT COMPILER</text>
    <g class="stage">
      <text y="42">Research</text><text x="37%" y="42">Governance</text><text x="74%" y="42">Knowledge</text>
      <use href="#connections"/>
    </g>
    <svg x="30" width="74%" height="70" overflow="visible">
      <g class="return" stroke-linecap="square">
        <line x1="100%" x2="100%" y1="51" y2="67"/>
        <line x1="100%" x2="0" y1="67" y2="67"/>
        <path d="M0 67V51" marker-end="url(#return-tip)"/>
      </g>
    </svg>
    <foreignObject y="78" width="100%" height="42"><p xmlns="http://www.w3.org/1999/xhtml">Governed analytical knowledge accumulates through research.</p></foreignObject>
  </g>
</svg>
